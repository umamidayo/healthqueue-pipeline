apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# App-of-apps entry point for the local minikube cluster. The root Application
# that points here is created by OpenTofu (infra/modules/platform), which also
# patches repoURL/targetRevision so a fork or feature branch can be tested.
resources:
  - ../../base
  - healthqueue-local.yaml
