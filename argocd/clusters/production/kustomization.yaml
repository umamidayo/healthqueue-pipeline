apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# App-of-apps entry point for the shared cluster that hosts the staging and
# production namespaces. See docs/adr/0003-gitops-with-argo-cd.md for why this
# reference uses namespaces rather than a separate cluster per environment.
resources:
  - ../../base
  - healthqueue-staging.yaml
  - healthqueue-production.yaml
