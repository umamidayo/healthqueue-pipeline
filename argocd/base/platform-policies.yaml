apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-policies
  namespace: argocd
  labels:
    healthqueue.io/environment: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    # Kyverno's admission webhook fills in defaults when a policy is created
    # (allowExistingViolations, signatureAlgorithm, validationFailureAction,
    # ...). A client-side diff sees those as permanent drift. A server-side
    # diff, including mutating webhooks, compares against what the API server
    # would actually store, so it survives new defaults in Kyverno upgrades.
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/umamidayo/healthqueue-pipeline.git
    targetRevision: main
    path: deploy/platform/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
