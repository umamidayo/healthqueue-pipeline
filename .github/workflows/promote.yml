# Promotes the build currently running in staging to production.
#
# The production gate is the GitHub Environment "production": add required
# reviewers to it (Settings > Environments) and every run waits for approval
# before anything changes. The job then re-verifies the image and commits the
# staging digest to deploy/overlays/production; Argo CD deploys it.
# No GitHub App or bot account is needed. See docs/adr/0013-promotion-without-a-bot.md.
name: promote

on:
  workflow_dispatch:
  # Uncomment to promote on a schedule once staging soak is trusted
  # (recommended by the DORA toil report).
  # schedule:
  #   - cron: "0 9-16 * * 1-5"

permissions: {}

concurrency:
  group: promote-production
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"
  COSIGN_VERSION: "v3.1.4"

jobs:
  promote:
    name: Promote staging to production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    permissions:
      contents: write # commit the digest to the production overlay
      packages: read # read signatures and attestations from GHCR
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Optional deploy key for a protected main (docs/operations.md, section 2).
          ssh-key: ${{ secrets.GITOPS_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: staging
        name: Read what staging runs
        run: node scripts/ci/release-outputs.mjs
      - name: Verify signature, SBOM and provenance
        if: steps.staging.outputs.same != 'true'
        env:
          REF: ${{ steps.staging.outputs.ref }}
        run: |
          # Without pipefail, tee would mask a failed verification.
          set -o pipefail
          bash scripts/ci/verify-image.sh "$REF" "$GITHUB_REPOSITORY" | tee verify.log
      - name: Install pinned, checksum-verified tools
        if: steps.staging.outputs.same != 'true'
        run: bash scripts/ci/install-tools.sh
      - name: Admission pre-check (the real Kyverno policies, same engine as the cluster)
        if: steps.staging.outputs.same != 'true'
        env:
          REF: ${{ steps.staging.outputs.ref }}
        run: |
          set -o pipefail
          bash scripts/ci/verify-admission.sh "$REF" | tee -a verify.log
      - name: Commit the production promotion
        if: steps.staging.outputs.same != 'true'
        env:
          SOURCE: ${{ steps.staging.outputs.source }}
          CURRENT: ${{ steps.staging.outputs.current }}
          REF: ${{ steps.staging.outputs.ref }}
        run: bash scripts/ci/promote-production.sh
      - name: Nothing to promote
        if: steps.staging.outputs.same == 'true'
        run: echo "Production already runs the staging digest." >> "$GITHUB_STEP_SUMMARY"
