# Offline policy unit tests: `kyverno test deploy/platform/policies/tests`.
# Only the digest policy is tested here; verify-images needs live registry and
# Rekor access and is exercised end-to-end by the CI "verify" job instead.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-trusted-digest-images
policies:
  - ../require-digest.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: require-trusted-digest-images
    rule: trusted-registry-and-digest
    resources: [good-digest]
    kind: Pod
    result: pass
  - policy: require-trusted-digest-images
    rule: trusted-registry-and-digest
    resources: [bad-tag, bad-registry, bad-init-container]
    kind: Pod
    result: fail
  - policy: require-trusted-digest-images
    rule: trusted-registry-and-digest
    resources: [local-unmatched]
    kind: Pod
    result: skip
