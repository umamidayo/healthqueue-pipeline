apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Environment-agnostic manifests. Overlays set the namespace, image digest,
# replica counts and resources. See docs/adr/0005-kustomize-over-helm.md.
labels:
  - pairs:
      app.kubernetes.io/name: healthqueue-api
      app.kubernetes.io/part-of: healthqueue
    includeSelectors: true
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml
  - networkpolicy.yaml
images:
  - name: healthqueue-api
